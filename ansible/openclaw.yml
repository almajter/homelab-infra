- name: openclaw-01 base
  hosts: openclaw-01
  tasks:
    - name: Base packages
      ansible.builtin.apt:
        name: [curl, ca-certificates, git]
        install_recommends: false
        update_cache: true
        cache_valid_time: 3600

    - name: Timezone
      community.general.timezone:
        name: Europe/Ljubljana

    - name: NodeSource repo
      ansible.builtin.deb822_repository:
        name: nodesource
        types: deb
        uris: https://deb.nodesource.com/node_24.x
        suites: nodistro
        components: main
        signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key

    - name: Node.js
      ansible.builtin.apt:
        name: nodejs
        install_recommends: false
        update_cache: true
        cache_valid_time: 0

    - name: Service user
      ansible.builtin.user:
        name: openclaw
        shell: /bin/bash
        create_home: true

    - name: OpenClaw CLI
      community.general.npm:
        name: openclaw
        global: true
        version: "2026.9.6"

    - name: Linger, so openclaw's user services run without a login
      ansible.builtin.command: loginctl enable-linger openclaw
      args:
        creates: /var/lib/systemd/linger/openclaw

    - name: Gateway service
      ansible.builtin.command: openclaw gateway install
      args:
        creates: /home/openclaw/.config/systemd/user/openclaw-gateway.service
      become: true
      become_method: ansible.builtin.su
      become_user: openclaw
      environment:
        XDG_RUNTIME_DIR: /run/user/1000
    - name: nftables
      ansible.builtin.apt: { name: nftables, install_recommends: false }

    - name: Firewall, gateway port reachable from proxy-01
      ansible.builtin.template:
        src: templates/nftables.conf.j2
        dest: /etc/nftables.conf
        mode: "0644"
        validate: nft -c -f %s
      notify: Reload nftables

    - name: nftables on at boot
      ansible.builtin.systemd: { name: nftables, enabled: true, state: started }

  handlers:
    - name: Reload nftables
      ansible.builtin.systemd: { name: nftables, state: reloaded }

